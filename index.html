// ============================================================
// Mustard Seed Enhanced - Main Game Engine
// ============================================================
class Game {
  constructor() {
    this.canvas = document.getElementById('gameCanvas');
    this.ctx = this.canvas.getContext('2d');
    this.mmCanvas = document.getElementById('minimap');
    this.mmCtx = this.mmCanvas.getContext('2d');
    this.width = 0;
    this.height = 0;

    // Camera
    this.camera = { x: 0, y: 0, zoom: 1, targetZoom: 1 };
    this.mouseScreen = { x: 0, y: 0 };

    // Entities
    this.creatures = [];       // player creatures
    this.aiCreatures = [];     // AI creatures
    this.aiGroups = new Map();
    this.particles = [];
    this.birthAnimations = [];

    // State
    this.playerLevel = 0;
    this.evolutionStage = 0;
    this.stageEnergy = 0;
    this.stageMaxEnergy = stageMaxEnergy(0);
    this.worldSize = CONFIG.WORLD_SIZE;
    this.frameCount = 0;
    this.gameStarted = false;
    this.respawnTimers = new Map();
    this.particleTargets = new Map();

    // Spatial hashing
    this.particleHash = new SpatialHash(200);
    this.creatureHash = new SpatialHash(500);

    // Score
    this.score = { startTime: 0, survivalTime: 0, maxLevel: 0, kills: 0 };

    // Danger warning
    this.dangerTimer = 0;

    // Player skill/dash cooldown tracking for UI
    this.playerDashCd = 0;
    this.playerSkillCd = 0;

    // One extra life
    this.hasExtraLife = true;

    // Environment zones
    this.zones = this._generateZones();

    // Shrinking circle (battle royale)
    this.circle = {
      phases: [
        { startFrame: 3600, duration: 1800, fromRadius: 5000, toRadius: 3000 },  // 60s: shrink over 30s
        { startFrame: 9000, duration: 1800, fromRadius: 3000, toRadius: 1750 },  // 150s: shrink over 30s
      ],
      currentPhase: 0,
      radius: 5000,        // current safe radius (half of worldSize)
      targetRadius: 5000,
      active: false,
      finished: false,
      damageTimer: 0,
      warningShown: [false, false],
    };

    // Showcase creature for title screen
    this.showcaseCreatures = [];
    this.previewMode = true;

    this.resize();
    this.preInit();          // create world before start
    this.setupStartScreen();
    this.setupEvents();
    this.animate();          // start rendering immediately (preview mode)
  }

  // --- Environment Zones ---
  _generateZones() {
    const zones = [];
    // Thermal vents - produce particles
    for (let i = 0; i < 8; i++) {
      const ang = (i / 8) * Math.PI * 2 + Math.random() * 0.5;
      const dist = 1500 + Math.random() * 3000;
      zones.push({
        type: 'vent',
        x: Math.cos(ang) * dist,
        y: Math.sin(ang) * dist,
        radius: 200 + Math.random() * 100,
        color: 'rgba(220,80,40,0.06)',
        spawnTimer: 0,
        spawnRate: 120 // frames between spawns
      });
    }
    // Current streams - speed boost areas
    for (let i = 0; i < 5; i++) {
      const ang = Math.random() * Math.PI * 2;
      const dist = 2000 + Math.random() * 2500;
      zones.push({
        type: 'current',
        x: Math.cos(ang) * dist,
        y: Math.sin(ang) * dist,
        radius: 300 + Math.random() * 200,
        angle: Math.random() * Math.PI * 2,
        strength: 1.5,
        color: 'rgba(30,120,220,0.05)'
      });
    }
    // Safe havens
    for (let i = 0; i < 3; i++) {
      const ang = Math.random() * Math.PI * 2;
      const dist = 1000 + Math.random() * 2000;
      zones.push({
        type: 'safe',
        x: Math.cos(ang) * dist,
        y: Math.sin(ang) * dist,
        radius: 250,
        color: 'rgba(20,160,80,0.04)'
      });
    }
    return zones;
  }

  // --- Init ---
  preInit() {
    // Create world entities for live background preview
    this.createAllAICreatures();
    this.generateParticles(CONFIG.PARTICLE_COUNT);
    this._spawnShowcaseCreature();
  }

  _spawnShowcaseCreature() {
    // Spawn a magenta Phantom (moth) for the title screen
    const level = 5; // Phantom - ethereal moth with translucent wings
    const spec = {
      ...SPECIES[level],
      color: '#d4207a',   // vibrant magenta
      glow: '#f040a0',    // bright magenta glow
    };
    const cls = CLASS_MAP[spec.cls];
    // Start near center so it's immediately visible
    const startX = this.camera ? this.camera.x : 0;
    const startY = this.camera ? this.camera.y + 80 : 80;
    const c = new cls(startX, startY, level, spec, true);
    c.velocity = { x: 0, y: 0 };
    c.flockId = 0;
    // Use natural scale for level 5 — no artificial enlargement
    c.scale = Math.pow(3, level / 7); // ≈ 2.19, same as in-game creatures
    c.groupId = 'showcase';
    c.complexityStage = 2; // full wing detail
    c.upgradeComplexity(2);
    c.wanderAngle = 0;
    c.wanderTimer = 0;
    c.isFrozen = false;
    c.frozenTimer = 0;
    c._showcaseAngle = -Math.PI / 2; // start from left side

    // Pre-run physics for 60 frames so chains are settled
    for (let i = 0; i < 60; i++) {
      c.update(startX + i * 2, startY, false, this.worldSize, []);
    }

    this.showcaseCreatures.push(c);
  }

  _updateShowcase() {
    // Move showcase creature in a gentle figure-8, kept within screen center area
    this.showcaseCreatures.forEach(c => {
      c._showcaseAngle += 0.004;
      const a = c._showcaseAngle;
      // Compact orbit — stays well within visible area
      const rx = this.width * 0.18 / this.camera.zoom;
      const ry = this.height * 0.10 / this.camera.zoom;
      const tx = this.camera.x + Math.sin(a) * rx;
      const ty = this.camera.y + 60 / this.camera.zoom + Math.sin(a * 2) * ry;
      c.update(tx, ty, false, this.worldSize, []);
    });
  }

  _drawShowcase(bounds) {
    this.showcaseCreatures.forEach(c => {
      if (!this.isInScreen(c, bounds)) return;
      c.draw(this.ctx);
    });
  }

  setupStartScreen() {
    const btn = document.getElementById('startButton');
    const overlay = document.getElementById('startOverlay');
    btn.addEventListener('click', () => {
      window.AudioMgr.init();
      // Fade out the overlay
      overlay.classList.add('hidden');
      setTimeout(() => {
        overlay.style.display = 'none';
        // Remove showcase creature from world
        this.showcaseCreatures = [];
        // Now start the actual game
        this.previewMode = false;
        this.gameStarted = true;
        this.init();
        // Show HUD elements
        document.getElementById('ui').classList.add('visible');
        document.getElementById('skillBar').classList.add('visible');
        document.getElementById('minimap').classList.add('visible');
        document.getElementById('info').classList.add('visible');
      }, 800);
    });
  }

  resize() {
    this.width = this.canvas.width = window.innerWidth;
    this.height = this.canvas.height = window.innerHeight;
    this.mouseScreen.x = this.width / 2;
    this.mouseScreen.y = this.height / 2;
  }

  init() {
    // Clear preview remnants and create fresh world
    this.aiCreatures = [];
    this.aiGroups.clear();
    this.particles = [];
    this.birthAnimations = [];
    this.respawnTimers.clear();
    this.particleTargets.clear();

    // Reset frame counter (preview may have accumulated frames)
    this.frameCount = 0;

    // Reset camera
    this.camera = { x: 0, y: 0, zoom: 1, targetZoom: 1 };

    // Reset shrinking circle
    this.circle.currentPhase = 0;
    this.circle.radius = 5000;
    this.circle.targetRadius = 5000;
    this.circle.active = false;
    this.circle.finished = false;
    this.circle.damageTimer = 0;
    this.circle.warningShown = [false, false];

    // Reset game state
    this.playerLevel = 0;
    this.evolutionStage = 0;
    this.stageEnergy = 0;
    this.stageMaxEnergy = stageMaxEnergy(0);
    this.hasExtraLife = true;
    this.dangerTimer = 0;
    this.playerDashCd = 0;
    this.playerSkillCd = 0;

    // Create fresh world
    this.createAllAICreatures();
    this.generateParticles(CONFIG.PARTICLE_COUNT);
    this.createPlayer(0, 0, true);
    this.score.startTime = Date.now();
    this.score.maxLevel = 0;
  }

  resetGame() {
    this.creatures = [];
    this.aiCreatures = [];
    this.aiGroups.clear();
    this.particles = [];
    this.particleTargets.clear();
    this.birthAnimations = [];
    this.respawnTimers.clear();
    this.playerLevel = 0;
    this.evolutionStage = 0;
    this.stageEnergy = 0;
    this.stageMaxEnergy = stageMaxEnergy(0);
    this.camera = { x: 0, y: 0, zoom: 1, targetZoom: 1 };
    this.frameCount = 0;
    this.hasExtraLife = true;
    this.score = { startTime: Date.now(), survivalTime: 0, maxLevel: 0, kills: 0 };

    // Reset shrinking circle
    this.circle.currentPhase = 0;
    this.circle.radius = 5000;
    this.circle.targetRadius = 5000;
    this.circle.active = false;
    this.circle.finished = false;
    this.circle.damageTimer = 0;
    this.circle.warningShown = [false, false];
    this.zones = this._generateZones();
    const go = document.getElementById('gameOverScreen');
    const gw = document.getElementById('gameWinScreen');
    if (go) go.remove();
    if (gw) gw.remove();
    this.init();
    this.updateUI();
  }

  // --- Events ---
  setupEvents() {
    window.addEventListener('resize', () => this.resize());

    this.canvas.addEventListener('mousemove', e => {
      this.mouseScreen.x = e.clientX;
      this.mouseScreen.y = e.clientY;
    });

    window.addEventListener('keydown', e => {
      if (!this.gameStarted) return;
      if (e.code === 'Space') {
        e.preventDefault();
        this.playerDash();
      }
      if (e.code === 'KeyQ') {
        this.playerSkill();
      }
    });
  }

  // --- Player Dash ---
  playerDash() {
    if (this.creatures.length === 0) return;
    const leader = this.creatures[0];
    if (leader.dashCooldown > 0 || leader.isDashing) return;

    window.AudioMgr.dash();
    const dx = this.mouseScreen.x - this.width / 2;
    const dy = this.mouseScreen.y - this.height / 2;
    const dist = Math.sqrt(dx * dx + dy * dy);
    if (dist < 1) return;

    this.creatures.forEach(c => {
      c.isDashing = true;
      c.dashTimer = CONFIG.DASH_DURATION;
      c.dashCooldown = CONFIG.DASH_COOLDOWN;
      c.dashDirX = dx / dist;
      c.dashDirY = dy / dist;
      c.invulnTimer = CONFIG.DASH_DURATION / 60;
    });
  }

  // --- Player Skill ---
  playerSkill() {
    if (this.creatures.length === 0) return;
    const leader = this.creatures[0];
    if (leader.skillCooldown > 0) return;

    const spec = SPECIES[this.playerLevel];
    leader.skillCooldown = spec.skillCd;
    window.AudioMgr.useSkill();

    switch (this.playerLevel) {
      case 0: // Ember - Blink forward
        this._skillBlink();
        break;
      case 1: // Needle - Pierce (speed burst + damage aura)
        this._skillPierce();
        break;
      case 2: // Bloom - Electric shock AOE
        this._skillShock();
        break;
      case 3: // Ribbon - Speed rush
        this._skillRush();
        break;
      case 4: // Fortress - Armor (invuln)
        this._skillArmor();
        break;
      case 5: // Phantom - Sonic wave (push enemies)
        this._skillSonicWave();
        break;
      case 6: // Nexus - Temporary split (extra heads)
        this._skillSplit();
        break;
      case 7: // Titan - Gravity pull
        this._skillGravity();
        break;
    }
  }

  _skillBlink() {
    const dist = 200 * (this.creatures[0].scale || 1);
    const ang = this.creatures[0].angle;
    this.creatures.forEach(c => {
      c.x += Math.cos(ang) * dist;
      c.y += Math.sin(ang) * dist;
      c.invulnTimer = 0.5;
    });
  }

  _skillPierce() {
    this.creatures.forEach(c => {
      c.isDashing = true;
      c.dashTimer = 20;
      c.dashDirX = Math.cos(c.angle);
      c.dashDirY = Math.sin(c.angle);
      c.invulnTimer = 0.5;
    });
  }

  _skillShock() {
    // Stun nearby AI
    const range = 300 * (this.creatures[0].scale || 1);
    const cx = this.creatures[0].x;
    const cy = this.creatures[0].y;
    this.aiCreatures.forEach(ai => {
      const dx = ai.x - cx;
      const dy = ai.y - cy;
      if (dx * dx + dy * dy < range * range) {
        ai.isFrozen = true;
        ai.frozenTimer = 90; // 1.5 sec stun
      }
    });
    // Visual flash
    this._evoFlash('rgba(200,60,60,0.15)');
  }

  _skillRush() {
    this.creatures.forEach(c => {
      c.isDashing = true;
      c.dashTimer = 30;
      c.dashDirX = Math.cos(c.angle);
      c.dashDirY = Math.sin(c.angle);
      c.invulnTimer = 0.5;
    });
  }

  _skillArmor() {
    this.creatures.forEach(c => {
      c.invulnTimer = 3; // 3 seconds invuln
    });
    this._evoFlash('rgba(200,140,20,0.15)');
  }

  _skillSonicWave() {
    const range = 500 * (this.creatures[0].scale || 1);
    const cx = this.creatures[0].x;
    const cy = this.creatures[0].y;
    this.aiCreatures.forEach(ai => {
      const dx = ai.x - cx;
      const dy = ai.y - cy;
      const d = Math.sqrt(dx * dx + dy * dy);
      if (d < range && d > 0) {
        const push = 200 * (1 - d / range);
        ai.x += (dx / d) * push;
        ai.y += (dy / d) * push;
      }
    });
  }

  _skillSplit() {
    // Temporarily double creature count for 5 seconds
    const copies = [];
    this.creatures.forEach(c => {
      const spec = SPECIES[this.playerLevel];
      const cls = CLASS_MAP[spec.cls];
      const nc = new cls(c.x + (Math.random() - 0.5) * 50, c.y + (Math.random() - 0.5) * 50,
        this.playerLevel, spec, false);
      nc.velocity = { x: 0, y: 0 };
      nc.scale = c.scale;
      nc.groupId = 'player';
      nc.isFrozen = false;
      nc.frozenTimer = 0;
      nc._tempClone = true;
      nc._cloneLife = 300; // 5 seconds
      copies.push(nc);
    });
    this.creatures.push(...copies);
  }

  _skillGravity() {
    // Pull all nearby particles and creatures toward player
    const range = 800 * (this.creatures[0].scale || 1);
    const cx = this.creatures[0].x;
    const cy = this.creatures[0].y;
    // Pull particles
    this.particles.forEach(p => {
      const dx = cx - p.x;
      const dy = cy - p.y;
      const d = Math.sqrt(dx * dx + dy * dy);
      if (d < range && d > 0) {
        const pull = 5 * (1 - d / range);
        p.vx += (dx / d) * pull;
        p.vy += (dy / d) * pull;
      }
    });
    // Pull lower-level AI
    this.aiCreatures.forEach(ai => {
      if (ai.type >= this.playerLevel) return;
      const dx = cx - ai.x;
      const dy = cy - ai.y;
      const d = Math.sqrt(dx * dx + dy * dy);
      if (d < range && d > 0) {
        const pull = 3 * (1 - d / range);
        ai.x += (dx / d) * pull;
        ai.y += (dy / d) * pull;
      }
    });
    this._evoFlash('rgba(200,50,50,0.12)');
  }

  _evoFlash(color) {
    const div = document.createElement('div');
    div.className = 'evo-flash';
    if (color) div.style.background = `radial-gradient(ellipse at center, ${color}, transparent)`;
    document.body.appendChild(div);
    setTimeout(() => div.remove(), 800);
  }

  // --- Particle Generation (Clustered) ---
  generateParticles(count) {
    const clusterCount = CONFIG.PARTICLE_CLUSTER_COUNT;
    const clusterSize = CONFIG.PARTICLE_CLUSTER_SIZE;
    const perCluster = Math.floor(count * 0.5 / clusterCount);
    const scattered = count - perCluster * clusterCount;

    // Clustered particles (50% near vents and random clusters)
    for (let c = 0; c < clusterCount; c++) {
      let cx, cy;
      if (c < this.zones.length && this.zones[c].type === 'vent') {
        cx = this.zones[c].x;
        cy = this.zones[c].y;
      } else {
        cx = (Math.random() - 0.5) * this.worldSize * 0.8;
        cy = (Math.random() - 0.5) * this.worldSize * 0.8;
      }
      for (let i = 0; i < perCluster; i++) {
        const ang = Math.random() * Math.PI * 2;
        const dist = Math.random() * clusterSize * (this.zones[c] ? this.zones[c].radius / 200 : 1) * 3;
        this.particles.push({
          x: cx + Math.cos(ang) * dist,
          y: cy + Math.sin(ang) * dist,
          size: Math.random() * 3 + 1.5,
          energy: 1,
          vx: (Math.random() - 0.5) * 0.5,
          vy: (Math.random() - 0.5) * 0.5
        });
      }
    }

    // Scattered particles (50%)
    for (let i = 0; i < scattered; i++) {
      this.particles.push({
        x: (Math.random() - 0.5) * this.worldSize,
        y: (Math.random() - 0.5) * this.worldSize,
        size: Math.random() * 3 + 1.5,
        energy: 1,
        vx: (Math.random() - 0.5) * 0.5,
        vy: (Math.random() - 0.5) * 0.5
      });
    }

    // Guarantee particles near spawn
    for (let i = 0; i < 30; i++) {
      const ang = Math.random() * Math.PI * 2;
      const dist = 50 + Math.random() * 250;
      this.particles.push({
        x: Math.cos(ang) * dist,
        y: Math.sin(ang) * dist,
        size: Math.random() * 3 + 1.5,
        energy: 1,
        vx: (Math.random() - 0.5) * 0.3,
        vy: (Math.random() - 0.5) * 0.3
      });
    }
  }

  // --- Creature Creation ---
  createPlayer(x = 0, y = 0, initial = false) {
    const spec = SPECIES[this.playerLevel];
    const scale = Math.pow(3, this.playerLevel / 7);
    this.camera.targetZoom = 1 / Math.pow(1.2, this.playerLevel);
    // Mobile: zoom out more so player can see further on small screens
    if (window.__isMobile) {
      this.camera.targetZoom *= 0.55;
    }
    this.creatures = [];

    let count;
    if (this.playerLevel >= 3) count = 1;
    else count = this.evolutionStage + 1;

    const cls = CLASS_MAP[spec.cls];
    for (let i = 0; i < count; i++) {
      const ang = (i / count) * Math.PI * 2;
      const offset = 50 * scale;
      const c = new cls(x + Math.cos(ang) * offset, y + Math.sin(ang) * offset, this.playerLevel, spec, false);
      c.velocity = { x: 0, y: 0 };
      c.flockId = i;
      c.scale = scale;
      c.complexityStage = 0;
      c.groupId = 'player';
      c.wanderAngle = Math.random() * Math.PI * 2;
      c.wanderTimer = 0;
      if (initial) { c.isFrozen = false; c.frozenTimer = 0; c.invulnTimer = 5; }
      this.creatures.push(c);
    }
    this.stageEnergy = 0;
    this.stageMaxEnergy = stageMaxEnergy(this.playerLevel);
    this.updateUI();
  }

  createAllAICreatures() {
    const half = this.worldSize / 2;
    const minDist = 1500;
    const placed = [];
    for (let lvl = 0; lvl < SPECIES.length; lvl++) {
      const count = CONFIG.INITIAL_AI_COUNTS[lvl] || 0;
      const sep = 800 * Math.pow(3, lvl / 7);
      for (let i = 0; i < count; i++) {
        let cx, cy, ok = false, attempts = 0;
        while (!ok && attempts < 50) {
          const ang = Math.random() * Math.PI * 2;
          const dist = minDist + Math.random() * (half - minDist);
          cx = Math.cos(ang) * dist;
          cy = Math.sin(ang) * dist;
          ok = true;
          for (const p of placed) {
            const dx = cx - p.x, dy = cy - p.y;
            if (Math.sqrt(dx * dx + dy * dy) < sep + p.sep) { ok = false; break; }
          }
          attempts++;
        }
        if (!ok) {
          const ang = Math.random() * Math.PI * 2;
          const dist = minDist + Math.random() * (half - minDist);
          cx = Math.cos(ang) * dist;
          cy = Math.sin(ang) * dist;
        }
        this.createAIGroup(lvl, cx, cy, 1, true);
        placed.push({ x: cx, y: cy, sep });
      }
    }
  }

  createAIGroup(level, x, y, count, initial = false) {
    const spec = SPECIES[level];
    const gid = Math.random();
    const scale = Math.pow(3, level / 7);
    this.aiGroups.set(gid, { level, evolutionStage: 0, energy: 0 });
    const cls = CLASS_MAP[spec.cls];
    for (let i = 0; i < count; i++) {
      const ang = (i / count) * Math.PI * 2;
      const offset = 50 * scale;
      const c = new cls(x + Math.cos(ang) * offset, y + Math.sin(ang) * offset, level, spec, true);
      c.velocity = { x: 0, y: 0 };
      c.flockId = i;
      c.scale = scale;
      c.groupId = gid;
      c.complexityStage = 0;
      c.wanderAngle = Math.random() * Math.PI * 2;
      c.wanderTimer = 0;
      if (initial) { c.isFrozen = false; c.frozenTimer = 0; }
      this.aiCreatures.push(c);
    }
  }

  // --- Respawn ---
  checkAndRespawnCreatures() {
    if (this.frameCount % 60 !== 0) return;

    // Count alive AI by level
    const counts = {};
    this.aiCreatures.forEach(c => {
      if (!c.isDying) counts[c.type] = (counts[c.type] || 0) + 1;
    });

    // Target counts depend on circle state
    // During/after shrinking: maintain a minimum population inside the safe zone
    const safeRadius = this.circle.finished ? this.circle.radius : 
                       (this.circle.active ? this.circle.radius : this.worldSize / 2);

    // Scale targets based on safe area ratio
    const areaRatio = (safeRadius * safeRadius) / (5000 * 5000);
    
    // Respawn levels 0-3 (small to mid creatures) to keep the world alive
    for (let lvl = 0; lvl <= 3; lvl++) {
      const baseTarget = CONFIG.INITIAL_AI_COUNTS[lvl] || 0;
      // Keep at least 40% of initial count, scaled by area
      const minTarget = Math.max(2, Math.floor(baseTarget * Math.max(0.4, areaRatio)));
      const current = counts[lvl] || 0;

      if (current < minTarget && !this.respawnTimers.has(lvl)) {
        // Shorter delay for low-level creatures, longer for higher
        const delay = (150 + lvl * 120) + Math.floor(Math.random() * 200);
        this.respawnTimers.set(lvl, delay);
      }

      if (this.respawnTimers.has(lvl)) {
        const t = this.respawnTimers.get(lvl) - 60;
        if (t <= 0) {
          this._spawnInSafeZone(lvl, safeRadius);
          this.respawnTimers.delete(lvl);
        } else {
          this.respawnTimers.set(lvl, t);
        }
      }
    }

    // Occasionally spawn mid-level creatures (4-5) if population is very low
    if (this.frameCount % 300 === 0) {
      for (let lvl = 4; lvl <= 5; lvl++) {
        const current = counts[lvl] || 0;
        const minTarget = Math.max(1, Math.floor((CONFIG.INITIAL_AI_COUNTS[lvl] || 0) * 0.3));
        if (current < minTarget) {
          this._spawnInSafeZone(lvl, safeRadius);
        }
      }
    }
  }

  _spawnAtEdge(level) {
    this._spawnInSafeZone(level, this.worldSize / 2);
  }

  _spawnInSafeZone(level, safeRadius) {
    const scale = Math.pow(3, level / 7);
    const minDistFromPlayer = 800 * scale;
    const playerX = this.creatures.length > 0 ? this.creatures[0].x : this.camera.x;
    const playerY = this.creatures.length > 0 ? this.creatures[0].y : this.camera.y;

    for (let i = 0; i < 50; i++) {
      // Random position inside safe zone
      const ang = Math.random() * Math.PI * 2;
      const dist = Math.random() * safeRadius * 0.85; // stay well inside
      const cx = Math.cos(ang) * dist;
      const cy = Math.sin(ang) * dist;

      // Must be far enough from player
      const dx = cx - playerX, dy = cy - playerY;
      if (dx * dx + dy * dy < minDistFromPlayer * minDistFromPlayer) continue;

      // Also avoid spawning on screen
      const screenDx = cx - this.camera.x, screenDy = cy - this.camera.y;
      const vw = this.width / this.camera.zoom / 2 + 200;
      const vh = this.height / this.camera.zoom / 2 + 200;
      if (Math.abs(screenDx) < vw && Math.abs(screenDy) < vh) continue;

      this.createAIGroup(level, cx, cy, 1, false);
      return;
    }

    // Fallback: spawn at random position inside safe zone
    const ang = Math.random() * Math.PI * 2;
    const dist = safeRadius * (0.3 + Math.random() * 0.5);
    this.createAIGroup(level, Math.cos(ang) * dist, Math.sin(ang) * dist, 1, false);
  }

  // --- Update UI ---
  updateUI() {
    const spec = SPECIES[this.playerLevel];
    document.getElementById('speciesName').textContent = spec.name;
    document.getElementById('speciesDesc').textContent = spec.desc;
    const pct = (this.stageEnergy / this.stageMaxEnergy * 100);
    document.getElementById('energyBar').style.width = pct + '%';
    document.getElementById('energyText').textContent =
      `阶段 ${this.evolutionStage + 1}/5 - ${Math.floor(this.stageEnergy)} / ${this.stageMaxEnergy}`;
    document.getElementById('creatureCount').textContent = this.creatures.length;
    document.getElementById('aiCount').textContent = this.aiCreatures.length;
    document.getElementById('killCount').textContent = this.score.kills;

    // Survival time
    if (this.score.startTime) {
      const sec = Math.floor((Date.now() - this.score.startTime) / 1000);
      const m = Math.floor(sec / 60);
      const s = sec % 60;
      document.getElementById('survivalTime').textContent = `${m}:${s.toString().padStart(2, '0')}`;
    }

    // Skill icons
    document.getElementById('skillIcon').textContent = spec.skillIcon;

    // Cooldowns
    this._updateCooldownUI();
  }

  _updateCooldownUI() {
    const leader = this.creatures[0];
    if (!leader) return;

    const skillSlot = document.getElementById('skill-q');
    const skillCdEl = document.getElementById('skillCd');
    if (leader.skillCooldown > 0) {
      skillSlot.classList.add('on-cd');
      skillCdEl.textContent = Math.ceil(leader.skillCooldown / 60) + 's';
    } else {
      skillSlot.classList.remove('on-cd');
    }

    const dashSlot = document.getElementById('skill-space');
    const dashCdEl = document.getElementById('dashCd');
    if (leader.dashCooldown > 0) {
      dashSlot.classList.add('on-cd');
      dashCdEl.textContent = Math.ceil(leader.dashCooldown / 60) + 's';
    } else {
      dashSlot.classList.remove('on-cd');
    }
  }

  // --- Camera ---
  updateCamera() {
    if (!this.creatures || this.creatures.length === 0) return;
    let tx = 0, ty = 0, cnt = 0;
    this.creatures.forEach(c => {
      if (c && typeof c.x === 'number') { tx += c.x; ty += c.y; cnt++; }
    });
    if (cnt === 0) return;
    tx /= cnt;
    ty /= cnt;
    this.camera.x += (tx - this.camera.x) * 0.08;
    this.camera.y += (ty - this.camera.y) * 0.08;
    this.camera.zoom += (this.camera.targetZoom - this.camera.zoom) * 0.05;
  }

  getScreenBounds(margin = 1) {
    const vw = (this.width / this.camera.zoom) * margin;
    const vh = (this.height / this.camera.zoom) * margin;
    return {
      minX: this.camera.x - vw / 2,
      maxX: this.camera.x + vw / 2,
      minY: this.camera.y - vh / 2,
      maxY: this.camera.y + vh / 2
    };
  }

  isInScreen(obj, bounds) {
    return obj.x > bounds.minX && obj.x < bounds.maxX && obj.y > bounds.minY && obj.y < bounds.maxY;
  }

  screenToWorld(sx, sy) {
    return {
      x: (sx - this.width / 2) / this.camera.zoom + this.camera.x,
      y: (sy - this.height / 2) / this.camera.zoom + this.camera.y
    };
  }

  // --- Flocking ---
  updateFlocking(creature, target, isAI = false) {
    const sc = creature.scale || 1;
    let steerX = 0, steerY = 0;
    let hasTarget = false;
    let targetX = 0, targetY = 0;

    if (isAI) {
      const t = this.findAITarget(creature);
      if (t) { targetX = t.x; targetY = t.y; hasTarget = true; }
    } else {
      targetX = target.x;
      targetY = target.y;
      hasTarget = true;

      // Player: also steer toward nearby lower-level AI (hunting assist)
      const huntRange = 500 * sc;
      let closest = null, closestDist = huntRange;
      this.aiCreatures.forEach(ai => {
        if (ai.type >= creature.type) return;
        const dx = ai.x - creature.x, dy = ai.y - creature.y;
        const d = Math.sqrt(dx * dx + dy * dy);
        if (d < closestDist) { closestDist = d; closest = ai; }
      });
      if (closest) {
        const dx = closest.x - creature.x, dy = closest.y - creature.y;
        const d = Math.sqrt(dx * dx + dy * dy);
        if (d > 0) {
          const w = 0.4 * (1 - closestDist / huntRange);
          targetX += (dx / d) * w * 200;
          targetY += (dy / d) * w * 200;
        }
      }
    }

    // Seek target
    if (hasTarget) {
      const dx = targetX - creature.x, dy = targetY - creature.y;
      const d = Math.sqrt(dx * dx + dy * dy);
      if (d > 0) { steerX += (dx / d); steerY += (dy / d); }
    }

    // Flee from higher-level creatures
    const fleeRange = 400 * sc;
    const fleeRangeSq = fleeRange * fleeRange;
    const allCreatures = isAI
      ? [...this.creatures, ...this.aiCreatures.filter(a => a !== creature)]
      : [...this.creatures.filter(c => c !== creature), ...this.aiCreatures];

    allCreatures.forEach(other => {
      if (other.type <= creature.type) return;
      const dx = creature.x - other.x, dy = creature.y - other.y;
      const dSq = dx * dx + dy * dy;
      if (dSq < fleeRangeSq && dSq > 0) {
        const d = Math.sqrt(dSq);
        const w = 0.5 * (1 - d / fleeRange);
        steerX += (dx / d) * w;
        steerY += (dy / d) * w;
      }
    });

    // AI: also flee from same-level player if near
    if (isAI && creature.type <= this.playerLevel) {
      this.creatures.forEach(pc => {
        const dx = creature.x - pc.x, dy = creature.y - pc.y;
        const dSq = dx * dx + dy * dy;
        const range = 300 * sc;
        if (dSq < range * range && dSq > 0) {
          const d = Math.sqrt(dSq);
          steerX += (dx / d) * CONFIG.FLEE_SPEED_MULT * 0.3;
          steerY += (dy / d) * CONFIG.FLEE_SPEED_MULT * 0.3;
        }
      });
    }

    // Separation from same-group
    const mates = isAI
      ? this.aiCreatures.filter(a => a !== creature && a.groupId === creature.groupId)
      : this.creatures.filter(c => c !== creature);
    if (mates.length > 0) {
      const sepRange = 150 * sc;
      const sepSq = sepRange * sepRange;
      mates.forEach(m => {
        const dx = creature.x - m.x, dy = creature.y - m.y;
        const dSq = dx * dx + dy * dy;
        if (dSq < sepSq && dSq > 0) {
          const d = Math.sqrt(dSq);
          steerX += (dx / d) * 0.5 * (1 - d / sepRange);
          steerY += (dy / d) * 0.5 * (1 - d / sepRange);
        }
      });

      // Cohesion
      const cohRange = 300 * sc;
      const avgX = mates.reduce((s, m) => s + m.x, 0) / mates.length;
      const avgY = mates.reduce((s, m) => s + m.y, 0) / mates.length;
      const cdx = avgX - creature.x, cdy = avgY - creature.y;
      const cd = cdx * cdx + cdy * cdy;
      if (cd > cohRange * cohRange) {
        const d = Math.sqrt(cd);
        steerX += (cdx / d) * 0.2;
        steerY += (cdy / d) * 0.2;
      }
    }

    // World boundary
    const half = this.worldSize / 2;
    const margin = 200 * sc;
    const distFromCenter = Math.sqrt(creature.x * creature.x + creature.y * creature.y);
    if (distFromCenter > half - margin) {
      const d = distFromCenter;
      if (d > 0) {
        const w = (distFromCenter - (half - margin)) / margin;
        steerX -= (creature.x / d) * w * 2;
        steerY -= (creature.y / d) * w * 2;
      }
    }

    // Apply steering to get target position
    const speed = (creature.isHunting && creature.config.huntSpeed || creature.config.speed) * 100;
    return {
      x: creature.x + steerX * speed,
      y: creature.y + steerY * speed
    };
  }

  findAITarget(creature) {
    // Wander + occasional particle seeking
    creature.wanderTimer++;
    if (creature.wanderTimer > 120) {
      creature.wanderAngle += (Math.random() - 0.5) * 1.0;
      creature.wanderTimer = 0;
    }
    const sc = creature.scale || 1;
    const wanderDist = 200 * sc;
    let tx = creature.x + Math.cos(creature.wanderAngle) * wanderDist;
    let ty = creature.y + Math.sin(creature.wanderAngle) * wanderDist;

    // Look for nearby lower-level prey
    const huntRange = CONFIG.AI_HUNT_RANGE * sc;
    let prey = null, preyDist = huntRange;
    const targets = creature.type > 0 ? [...this.creatures, ...this.aiCreatures] : this.aiCreatures;
    targets.forEach(t => {
      if (t === creature || t.groupId === creature.groupId) return;
      if (t.type >= creature.type) return;
      const dx = t.x - creature.x, dy = t.y - creature.y;
      const d = Math.sqrt(dx * dx + dy * dy);
      if (d < preyDist) { preyDist = d; prey = t; }
    });

    // Grace period: AI won't hunt targets near spawn in first 30 seconds
    if (prey && this.frameCount < CONFIG.AI_GRACE_PERIOD) {
      const preyDistFromSpawn = Math.sqrt(prey.x * prey.x + prey.y * prey.y);
      if (preyDistFromSpawn < CONFIG.SPAWN_SAFE_RADIUS) prey = null;
    }

    if (prey) {
      tx = prey.x;
      ty = prey.y;
      if (!creature.isHunting && creature.huntCooldownTimer <= 0) {
        creature.isHunting = true;
        creature.huntTimer = 0;
      }
    }

    return { x: tx, y: ty };
  }

  isPlayerHunting(creature) {
    if (creature.isHunting) return true;
    // Auto-hunt when near lower-level AI
    const range = 400 * (creature.scale || 1);
    for (const ai of this.aiCreatures) {
      if (ai.type >= creature.type) continue;
      const dx = ai.x - creature.x, dy = ai.y - creature.y;
      if (dx * dx + dy * dy < range * range) {
        if (!creature.isHunting && creature.huntCooldownTimer <= 0) {
          creature.isHunting = true;
          creature.huntTimer = 0;
        }
        return true;
      }
    }
    return false;
  }

  // --- Evolution ---
  advanceStage() {
    if (this.birthAnimations.some(b => !b.isAI && !b.isAIEvolution)) return;
    if (this.creatures.length === 0) return;

    this.stageEnergy = 0;
    this.evolutionStage++;

    window.AudioMgr.advanceStage();
    this._evoFlash();

    if (this.evolutionStage >= 5) {
      if (this.playerLevel >= SPECIES.length - 1) {
        this.gameWin();
        return;
      }
      this.evolveToNextSpecies();
    } else {
      if (this.playerLevel >= 3) this.upgradeCreatureComplexity();
      else this.addCreature();
    }
    this.updateUI();
  }

  addCreature() {
    if (this.creatures.length === 0) return;
    const spec = SPECIES[this.playerLevel];
    const scale = Math.pow(3, this.playerLevel / 7);
    const avgX = this.creatures.reduce((s, c) => s + c.x, 0) / this.creatures.length;
    const avgY = this.creatures.reduce((s, c) => s + c.y, 0) / this.creatures.length;
    const ang = Math.random() * Math.PI * 2;
    const dist = 150 * scale;
    const cls = CLASS_MAP[spec.cls];
    const nc = new cls(avgX + Math.cos(ang) * dist, avgY + Math.sin(ang) * dist,
      this.playerLevel, spec, false);
    nc.velocity = { x: 0, y: 0 };
    nc.flockId = this.creatures.length;
    nc.scale = scale;
    nc.groupId = 'player';
    nc.wanderAngle = Math.random() * Math.PI * 2;
    this.creatures.push(nc);
  }

  upgradeCreatureComplexity() {
    this.creatures.forEach(c => {
      c.complexityStage = this.evolutionStage;
      c.upgradeComplexity(this.evolutionStage);
    });
  }

  evolveToNextSpecies() {
    if (this.playerLevel >= SPECIES.length - 1) return;
    if (this.creatures.length === 0) return;

    window.AudioMgr.evolve();
    this._evoFlash();

    const avgX = this.creatures.reduce((s, c) => s + c.x, 0) / this.creatures.length;
    const avgY = this.creatures.reduce((s, c) => s + c.y, 0) / this.creatures.length;

    this.creatures = [];
    this.playerLevel++;
    this.evolutionStage = 0;
    if (this.playerLevel > this.score.maxLevel) this.score.maxLevel = this.playerLevel;
    this.stageMaxEnergy = stageMaxEnergy(this.playerLevel);

    this.createPlayer(avgX, avgY, true);
  }

  // --- AI Evolution ---
  evolveAIGroup(gid) {
    const group = this.aiGroups.get(gid);
    if (!group) return;
    const nextLevel = group.level + 1;
    if (nextLevel >= SPECIES.length) return;

    const members = this.aiCreatures.filter(c => c.groupId === gid);
    if (members.length === 0) return;
    const avgX = members.reduce((s, c) => s + c.x, 0) / members.length;
    const avgY = members.reduce((s, c) => s + c.y, 0) / members.length;

    this.aiCreatures = this.aiCreatures.filter(c => c.groupId !== gid);
    this.aiGroups.delete(gid);
    this.createAIGroup(nextLevel, avgX, avgY, 1, false);
  }

  // --- Game Over / Win ---
  gameOver() {
    if (this.hasExtraLife) {
      // Use extra life - respawn at lower level
      this.hasExtraLife = false;
      if (this.playerLevel > 0) this.playerLevel--;
      this.evolutionStage = 0;
      this.stageEnergy = 0;
      this.stageMaxEnergy = stageMaxEnergy(this.playerLevel);
      this.createPlayer(this.camera.x, this.camera.y, true);
      this.creatures.forEach(c => { c.invulnTimer = 3; });
      this._evoFlash('rgba(200,180,30,0.2)');
      return;
    }

    this.score.survivalTime = Math.floor((Date.now() - this.score.startTime) / 1000);
    window.AudioMgr.gameOver();

    const div = document.createElement('div');
    div.id = 'gameOverScreen';
    div.className = 'overlay-screen';
    div.style.background = 'radial-gradient(ellipse at center, rgba(245,240,240,0.96), rgba(230,235,242,0.98))';
    const m = Math.floor(this.score.survivalTime / 60);
    const s = this.score.survivalTime % 60;
    div.innerHTML = `
      <div class="panel">
        <h2 style="color:#c03030">GAME OVER</h2>
        <div style="color:rgba(60,80,110,0.6);font-size:18px;margin-bottom:18px">你的所有生物都被消灭了</div>
        <div class="stat-grid">
          <span class="label">最高物种</span><span class="value">${SPECIES[this.score.maxLevel].name}</span>
          <span class="label">存活时间</span><span class="value">${m}:${s.toString().padStart(2, '0')}</span>
          <span class="label">击杀数</span><span class="value">${this.score.kills}</span>
          <span class="label">总分</span><span class="value">${this.score.maxLevel * 1000 + this.score.survivalTime * 10 + this.score.kills * 100}</span>
        </div>
        <button id="retryBtn">再来一次</button>
      </div>`;
    document.body.appendChild(div);
    document.getElementById('retryBtn').addEventListener('click', () => this.resetGame());
  }

  gameWin() {
    this.score.survivalTime = Math.floor((Date.now() - this.score.startTime) / 1000);
    window.AudioMgr.victory();

    const div = document.createElement('div');
    div.id = 'gameWinScreen';
    div.className = 'overlay-screen';
    div.style.background = 'radial-gradient(ellipse at center, rgba(240,248,242,0.96), rgba(230,235,242,0.98))';
    const m = Math.floor(this.score.survivalTime / 60);
    const s = this.score.survivalTime % 60;
    div.innerHTML = `
      <div class="panel">
        <h2 style="color:#1a7a9c">VICTORY</h2>
        <div style="color:rgba(40,60,90,0.65);font-size:18px">你已进化至终极形态</div>
        <div style="color:#c03030;font-size:26px;margin:12px 0;letter-spacing:4px">利维坦 · 第五阶段</div>
        <div class="stat-grid">
          <span class="label">存活时间</span><span class="value">${m}:${s.toString().padStart(2, '0')}</span>
          <span class="label">击杀数</span><span class="value">${this.score.kills}</span>
          <span class="label">总分</span><span class="value">${7000 + this.score.survivalTime * 10 + this.score.kills * 100}</span>
        </div>
        <button id="replayBtn">再来一次</button>
      </div>`;
    document.body.appendChild(div);
    document.getElementById('replayBtn').addEventListener('click', () => this.resetGame());
  }

  // --- Minimap ---
  drawMinimap() {
    const mm = this.mmCtx;
    const w = this.mmCanvas.width, h = this.mmCanvas.height;
    const half = this.worldSize / 2;

    mm.fillStyle = 'rgba(235,240,248,0.85)';
    mm.fillRect(0, 0, w, h);

    // Map coordinates to minimap
    const toMM = (x, y) => ({
      x: (x / this.worldSize + 0.5) * w,
      y: (y / this.worldSize + 0.5) * h
    });

    // Zones
    this.zones.forEach(z => {
      const p = toMM(z.x, z.y);
      const r = (z.radius / this.worldSize) * w;
      mm.fillStyle = z.type === 'vent' ? 'rgba(220,80,40,0.25)' :
                     z.type === 'current' ? 'rgba(30,120,220,0.2)' : 'rgba(20,160,80,0.2)';
      mm.beginPath();
      mm.arc(p.x, p.y, Math.max(2, r), 0, Math.PI * 2);
      mm.fill();
    });

    // Particle density (sampled)
    if (this.frameCount % 30 === 0) {
      this._mmParticleCache = [];
      const gridSize = 20;
      const density = new Map();
      const step = Math.max(1, Math.floor(this.particles.length / 500));
      for (let i = 0; i < this.particles.length; i += step) {
        const p = this.particles[i];
        const gx = Math.floor(p.x / (this.worldSize / gridSize));
        const gy = Math.floor(p.y / (this.worldSize / gridSize));
        const key = gx * 100 + gy;
        density.set(key, (density.get(key) || 0) + 1);
      }
      density.forEach((count, key) => {
        if (count > 2) {
          const gx = Math.floor(key / 100);
          const gy = key % 100;
          this._mmParticleCache.push({ gx, gy, count });
        }
      });
    }
    if (this._mmParticleCache) {
      this._mmParticleCache.forEach(({ gx, gy, count }) => {
        const gridSize = 20;
        const px = ((gx + 0.5) / gridSize + 0.5) * w;
        const py = ((gy + 0.5) / gridSize + 0.5) * h;
        const alpha = Math.min(0.6, count * 0.05);
        mm.fillStyle = `rgba(42,90,140,${alpha})`;
        mm.fillRect(px - 1, py - 1, 3, 3);
      });
    }

    // AI creatures (by level color)
    this.aiCreatures.forEach(c => {
      if (c.isDying) return;
      const p = toMM(c.x, c.y);
      mm.fillStyle = c.type > this.playerLevel ? '#c03030' :
                     c.type === this.playerLevel ? '#ff0' : '#888';
      const size = c.type >= this.playerLevel ? 2 : 1;
      mm.fillRect(p.x - size / 2, p.y - size / 2, size, size);
    });

    // Player
    this.creatures.forEach(c => {
      const p = toMM(c.x, c.y);
      mm.fillStyle = '#1a7a9c';
      mm.beginPath();
      mm.arc(p.x, p.y, 3, 0, Math.PI * 2);
      mm.fill();
    });

    // Shrinking circle on minimap (hide after circle is done)
    if (this.circle.active && !this.circle.finished) {
      const cr = (this.circle.radius / this.worldSize) * w;
      mm.beginPath();
      mm.arc(w / 2, h / 2, cr, 0, Math.PI * 2);
      mm.strokeStyle = 'rgba(200,50,50,0.5)';
      mm.lineWidth = 1.5;
      mm.stroke();
    }

    // Camera viewport
    const vw = (this.width / this.camera.zoom / this.worldSize) * w;
    const vh = (this.height / this.camera.zoom / this.worldSize) * h;
    const cp = toMM(this.camera.x, this.camera.y);
    mm.strokeStyle = 'rgba(42,90,140,0.4)';
    mm.lineWidth = 1;
    mm.strokeRect(cp.x - vw / 2, cp.y - vh / 2, vw, vh);

    // Border
    mm.strokeStyle = 'rgba(42,90,140,0.2)';
    mm.strokeRect(0, 0, w, h);
  }

  // --- Main Update ---
  update() {
    // Mobile joystick: map joystick displacement to mouseScreen
    const joy = window.__joystick;
    if (joy) {
      if (joy.active) {
        const sensitivity = 4.5;
        this.mouseScreen.x = this.width / 2 + joy.dx * sensitivity;
        this.mouseScreen.y = this.height / 2 + joy.dy * sensitivity;
      } else {
        // No joystick touch — creature drifts to standstill
        this.mouseScreen.x = this.width / 2;
        this.mouseScreen.y = this.height / 2;
      }
    }

    this.frameCount++;

    // Update shrinking circle
    this.updateCircle();

    // Update spatial hash
    this.particleHash.clear();
    this.particles.forEach(p => this.particleHash.insert(p));

    // Zone effects
    this._updateZones();

    // Respawn
    this.checkAndRespawnCreatures();

    // Remove dead creatures
    this.aiCreatures = this.aiCreatures.filter(c => !c.isDeathComplete());

    // Remove temp clones
    this.creatures = this.creatures.filter(c => {
      if (c._tempClone) {
        c._cloneLife--;
        if (c._cloneLife <= 0) return false;
      }
      return !c.isDeathComplete();
    });

    // AI creature updates
    const eatenByAI = new Set();
    const aiKills = [];
    const lowerAI = this.aiCreatures.filter(c => c.type < this.playerLevel && !c.isDying);

    this.aiCreatures.forEach(c => {
      if (!c || c.isDying || c.isFrozen) {
        if (c && c.isFrozen) {
          c.update(c.x, c.y, false, this.worldSize, []);
        }
        return;
      }
      // AI flocking
      const target = this.updateFlocking(c, null, true);
      let dx = target.x - c.x, dy = target.y - c.y;

      // Add noise for low-level
      if (c.type === 0) {
        dx += (Math.random() - 0.5) * 30;
        dy += (Math.random() - 0.5) * 30;
      }

      const dist = Math.sqrt(dx * dx + dy * dy);
      const speed = (c.isHunting && c.config.huntSpeed || c.config.speed) * 100;
      let vx, vy;
      if (dist > speed) { vx = (dx / dist) * speed; vy = (dy / dist) * speed; }
      else { vx = dx; vy = dy; }

      c.x += vx; c.y += vy;

      // World bounds
      const half = this.worldSize / 2;
      c.x = Math.max(-half, Math.min(half, c.x));
      c.y = Math.max(-half, Math.min(half, c.y));

      if (Math.sqrt(vx * vx + vy * vy) > 0.1) c.angle = Math.atan2(vy, vx);
      c.velocity.x = vx; c.velocity.y = vy;

      // Eat particles (using spatial hash)
      const nearby = this.particleHash.query(c.x, c.y, 50 * (c.scale || 1));
      const eaten = c.update(c.x, c.y, false, this.worldSize, nearby);
      if (eaten && eaten.length > 0) {
        eaten.forEach(p => {
          if (p && !eatenByAI.has(p)) {
            eatenByAI.add(p);
            // Give energy to AI group
            const group = this.aiGroups.get(c.groupId);
            if (group) group.energy += (p.energy || 1);
          }
        });
      }

      // Attack other creatures
      const attacked = c.detectAndAttackCreatures(
        c.type > 0 ? [...this.creatures.filter(pc => pc.type < c.type), ...lowerAI.filter(a => a !== c && a.type < c.type)] : []
      );
      if (attacked && !aiKills.some(k => k.creature === attacked)) {
        aiKills.push({ creature: attacked, killedByPlayer: false });
      }
    });

    // AI group energy/evolution
    for (const [gid, group] of this.aiGroups) {
      if (group.isEvolving) continue;
      const maxE = stageMaxEnergy(group.level);
      if (group.energy >= maxE) {
        group.energy = 0;
        group.evolutionStage++;
        if (group.evolutionStage >= 5) {
          if (group.level < SPECIES.length - 1) {
            this.evolveAIGroup(gid);
          } else {
            group.evolutionStage = 0;
          }
        }
      }
    }

    if (this.creatures.length === 0) {
      this.updateCamera();
      return;
    }

    // Player creature updates
    const mouseWorld = this.screenToWorld(this.mouseScreen.x, this.mouseScreen.y);
    let playerEatenEnergy = 0;
    const playerKills = [];

    this.creatures.forEach(c => {
      if (!c || !c.update) return;
      if (c.isFrozen) {
        c.update(c.x, c.y, false, this.worldSize, []);
        return;
      }

      // Dash override
      if (c.isDashing) {
        const dashSpeed = CONFIG.DASH_SPEED * (c.scale || 1);
        c.x += c.dashDirX * dashSpeed;
        c.y += c.dashDirY * dashSpeed;
      } else {
        const target = this.updateFlocking(c, mouseWorld);
        let dx = target.x - c.x, dy = target.y - c.y;

        if (c.type === 0) {
          dx += (Math.random() - 0.5) * 30;
          dy += (Math.random() - 0.5) * 30;
        }

        const dist = Math.sqrt(dx * dx + dy * dy);
        const speed = (this.isPlayerHunting(c) && c.config.huntSpeed || c.config.speed) * 100;
        let vx, vy;
        if (dist > speed) { vx = (dx / dist) * speed; vy = (dy / dist) * speed; }
        else { vx = dx; vy = dy; }

        c.x += vx; c.y += vy;

        if (Math.sqrt(vx * vx + vy * vy) > 0.1) c.angle = Math.atan2(vy, vx);
        c.velocity.x = vx; c.velocity.y = vy;
      }

      // World bounds
      const half = this.worldSize / 2;
      c.x = Math.max(-half, Math.min(half, c.x));
      c.y = Math.max(-half, Math.min(half, c.y));

      // Eat nearby particles
      const nearby = this.particleHash.query(c.x, c.y, 60 * (c.scale || 1));
      const eaten = c.update(c.x, c.y, false, this.worldSize, nearby);
      if (eaten && eaten.length > 0) {
        eaten.forEach(p => {
          if (p) playerEatenEnergy += (p.energy || 1);
        });
        window.AudioMgr.eatParticle();
      }

      // Attack lower-level AI
      const attacked = c.detectAndAttackCreatures(
        this.aiCreatures.filter(ai => ai.type < c.type && !ai.isDying)
      );
      if (attacked && !playerKills.some(k => k.creature === attacked)) {
        playerKills.push({ creature: attacked, killedByPlayer: true });
      }
    });

    // Same-level bounce
    this.creatures.forEach(pc => {
      this.aiCreatures.forEach(ai => {
        if (ai.type !== pc.type || ai.isDying) return;
        const dx = pc.x - ai.x, dy = pc.y - ai.y;
        const d = Math.sqrt(dx * dx + dy * dy);
        const minD = CONFIG.SAME_LEVEL_BOUNCE * (pc.scale || 1);
        if (d < minD && d > 0) {
          const push = (minD - d) * 0.5;
          pc.x += (dx / d) * push;
          pc.y += (dy / d) * push;
          ai.x -= (dx / d) * push * 0.3;
          ai.y -= (dy / d) * push * 0.3;
        }
      });
    });

    // Process kills
    [...playerKills, ...aiKills].forEach(({ creature, killedByPlayer }) => {
      const deathParticles = creature.startDeath();
      deathParticles.forEach(p => this.particles.push(p));

      if (killedByPlayer) {
        this.score.kills++;
        window.AudioMgr.killCreature();
        // Energy bonus for kills
        const bonus = 5 * (creature.type + 1);
        playerEatenEnergy += bonus;
      }

      // Give energy to AI group that killed
      if (!killedByPlayer) {
        // Find killer's group
        this.aiCreatures.forEach(ai => {
          if (ai.isDying) return;
          const dx = ai.x - creature.x, dy = ai.y - creature.y;
          if (dx * dx + dy * dy < 300 * 300) {
            const group = this.aiGroups.get(ai.groupId);
            if (group) group.energy += 5;
          }
        });
      }
    });

    // Add player energy
    if (playerEatenEnergy > 0 && this.stageEnergy < this.stageMaxEnergy) {
      this.stageEnergy += playerEatenEnergy;
      if (this.stageEnergy > this.stageMaxEnergy) this.stageEnergy = this.stageMaxEnergy;
      this.updateUI();
    }

    // Check stage advance
    const hasAnim = this.birthAnimations.some(b => !b.isAI && !b.isAIEvolution);
    if (this.stageEnergy >= this.stageMaxEnergy && !hasAnim && this.creatures.length > 0) {
      this.advanceStage();
    }

    // Check if all player creatures dead
    if (this.creatures.length === 0 && !hasAnim) {
      this.gameOver();
    }

    // Danger warning
    this._checkDanger();

    // Update particles (drift + keep inside circle)
    if (this.frameCount % 3 === 0) {
      const circleR = this.circle.active ? this.circle.radius : this.worldSize / 2;
      const circleR2 = circleR * circleR;
      this.particles.forEach(p => {
        p.x += p.vx;
        p.y += p.vy;
        // Push particles back inside safe zone
        const pd2 = p.x * p.x + p.y * p.y;
        if (pd2 > circleR2 && pd2 > 0) {
          const pd = Math.sqrt(pd2);
          const pushBack = 0.02;
          p.x -= (p.x / pd) * pushBack * (pd - circleR);
          p.y -= (p.y / pd) * pushBack * (pd - circleR);
        }
        p.vx *= 0.99;
        p.vy *= 0.99;
      });
    }

    // Remove eaten particles (by nearby array match - approximate)
    // Particles eaten by player are removed from the main array via matching
    // This is approximate since we use spatial hash subsets

    // Remove eaten particles
    this.particles = this.particles.filter(p => !p._eaten);

    this.updateCamera();
    this.updateUI();
  }

  _updateZones() {
    this.zones.forEach(zone => {
      if (zone.type === 'vent') {
        zone.spawnTimer++;
        if (zone.spawnTimer >= zone.spawnRate) {
          zone.spawnTimer = 0;
          // Spawn a few particles
          for (let i = 0; i < 3; i++) {
            const ang = Math.random() * Math.PI * 2;
            const dist = Math.random() * zone.radius;
            this.particles.push({
              x: zone.x + Math.cos(ang) * dist,
              y: zone.y + Math.sin(ang) * dist,
              size: Math.random() * 3 + 1.5,
              energy: 1,
              vx: (Math.random() - 0.5) * 0.5,
              vy: (Math.random() - 0.5) * 0.5
            });
          }
        }
      }

      if (zone.type === 'current') {
        // Apply current force to nearby creatures
        const allC = [...this.creatures, ...this.aiCreatures];
        allC.forEach(c => {
          const dx = c.x - zone.x, dy = c.y - zone.y;
          if (dx * dx + dy * dy < zone.radius * zone.radius) {
            c.x += Math.cos(zone.angle) * zone.strength;
            c.y += Math.sin(zone.angle) * zone.strength;
          }
        });
      }
    });
  }

  _checkDanger() {
    if (this.creatures.length === 0) return;
    const cx = this.creatures[0].x, cy = this.creatures[0].y;
    const range = CONFIG.DANGER_RANGE * (this.creatures[0].scale || 1);
    let danger = false;
    this.aiCreatures.forEach(ai => {
      if (ai.type <= this.playerLevel) return;
      const dx = ai.x - cx, dy = ai.y - cy;
      if (dx * dx + dy * dy < range * range) danger = true;
    });
    if (danger && this.dangerTimer <= 0) {
      window.AudioMgr.danger();
      this.dangerTimer = 180; // 3 sec between warnings
    }
    if (this.dangerTimer > 0) this.dangerTimer--;
  }

  // --- Shrinking Circle (Battle Royale) ---
  updateCircle() {
    if (this.circle.finished) return;
    const fc = this.frameCount;
    const phase = this.circle.phases[this.circle.currentPhase];
    if (!phase) { this.circle.finished = true; return; }

    // Warning 10 seconds before shrink starts
    const warnFrame = phase.startFrame - 600;
    if (fc >= warnFrame && !this.circle.warningShown[this.circle.currentPhase]) {
      this.circle.warningShown[this.circle.currentPhase] = true;
      this.circle.active = true;
    }

    // During shrink
    if (fc >= phase.startFrame && fc < phase.startFrame + phase.duration) {
      const progress = (fc - phase.startFrame) / phase.duration;
      this.circle.radius = phase.fromRadius + (phase.toRadius - phase.fromRadius) * progress;
      this.circle.targetRadius = phase.toRadius;
    }
    // After shrink completes
    else if (fc >= phase.startFrame + phase.duration) {
      this.circle.radius = phase.toRadius;
      this.circle.currentPhase++;
      if (this.circle.currentPhase >= this.circle.phases.length) {
        this.circle.finished = true;
      }
    }

    // Apply damage to creatures outside circle every 30 frames (0.5s)
    if (fc % 30 === 0) {
      const r = this.circle.radius;
      const r2 = r * r;

      // Damage AI creatures outside circle - kill them
      this.aiCreatures.forEach(c => {
        if (c.isDying) return;
        const d2 = c.x * c.x + c.y * c.y;
        if (d2 > r2) {
          const particles = c.startDeath();
          particles.forEach(p => this.particles.push(p));
        }
      });

      // Damage player creatures outside circle
      this.creatures.forEach(c => {
        if (c.isDying || c.invulnTimer > 0) return;
        const d2 = c.x * c.x + c.y * c.y;
        if (d2 > r2) {
          // Player gets a warning flash first, then dies after 2 seconds outside
          if (!c._outsideCircleTimer) c._outsideCircleTimer = 0;
          c._outsideCircleTimer += 30;
          if (c._outsideCircleTimer >= 120) { // 2 seconds grace
            const particles = c.startDeath();
            particles.forEach(p => this.particles.push(p));
          }
        } else {
          c._outsideCircleTimer = 0;
        }
      });
    }
  }

  drawCircle() {
    if (!this.circle.active || this.circle.finished) return;
    const r = this.circle.radius;

    this.ctx.save();
    this.ctx.translate(this.width / 2, this.height / 2);
    this.ctx.scale(this.camera.zoom, this.camera.zoom);
    this.ctx.translate(-this.camera.x, -this.camera.y);

    // Draw the danger zone outside the circle (red tinted area)
    // Use a large rect with circle cut out
    const bigR = this.worldSize;
    this.ctx.beginPath();
    this.ctx.rect(-bigR, -bigR, bigR * 2, bigR * 2);
    this.ctx.arc(0, 0, r, 0, Math.PI * 2, true); // cut out safe zone
    this.ctx.closePath();

    // Pulsing red overlay for danger zone
    const pulse = 0.5 + 0.15 * Math.sin(this.frameCount * 0.03);
    const isShrinking = !this.circle.finished && this.circle.currentPhase < this.circle.phases.length
      && this.frameCount >= this.circle.phases[this.circle.currentPhase].startFrame;
    const alpha = isShrinking ? 0.18 * pulse : 0.10;
    this.ctx.fillStyle = `rgba(200,40,40,${alpha})`;
    this.ctx.fill();

    // Circle edge line
    this.ctx.beginPath();
    this.ctx.arc(0, 0, r, 0, Math.PI * 2);
    const edgeAlpha = isShrinking ? 0.6 : 0.35;
    this.ctx.strokeStyle = `rgba(200,50,50,${edgeAlpha})`;
    this.ctx.lineWidth = isShrinking ? 4 / this.camera.zoom : 2 / this.camera.zoom;
    this.ctx.stroke();

    // Target circle (preview where it's shrinking to)
    if (isShrinking) {
      const phase = this.circle.phases[this.circle.currentPhase];
      this.ctx.beginPath();
      this.ctx.arc(0, 0, phase.toRadius, 0, Math.PI * 2);
      this.ctx.strokeStyle = 'rgba(200,50,50,0.2)';
      this.ctx.lineWidth = 1.5 / this.camera.zoom;
      this.ctx.setLineDash([20 / this.camera.zoom, 15 / this.camera.zoom]);
      this.ctx.stroke();
      this.ctx.setLineDash([]);
    }

    this.ctx.restore();
  }

  drawCircleUI() {
    if (!this.circle.active && !this.circle.finished) return;
    const fc = this.frameCount;

    // Find relevant phase info for UI
    let text = '';
    let urgentColor = false;

    if (!this.circle.finished && this.circle.currentPhase < this.circle.phases.length) {
      const phase = this.circle.phases[this.circle.currentPhase];
      if (fc < phase.startFrame) {
        const secsLeft = Math.ceil((phase.startFrame - fc) / 60);
        text = `⚠ 缩圈 ${this.circle.currentPhase + 1}/2 将在 ${secsLeft}s 后开始`;
        if (secsLeft <= 5) urgentColor = true;
      } else if (fc < phase.startFrame + phase.duration) {
        const secsLeft = Math.ceil((phase.startFrame + phase.duration - fc) / 60);
        text = `🔴 缩圈中... ${secsLeft}s`;
        urgentColor = true;
      }
    } else if (this.circle.finished) {
      // Show "circle complete" briefly
      if (fc < this.circle.phases[1].startFrame + this.circle.phases[1].duration + 300) {
        text = '✅ 缩圈完毕 - 自由模式';
      }
    }

    if (!text) return;

    // Draw at top center of screen
    this.ctx.save();
    this.ctx.font = 'bold 16px "Courier New", monospace';
    this.ctx.textAlign = 'center';
    this.ctx.textBaseline = 'middle';

    const metrics = this.ctx.measureText(text);
    const pw = metrics.width + 36;
    const ph = 36;
    const px = this.width / 2 - pw / 2;
    const py = 18;

    // Background pill
    this.ctx.fillStyle = urgentColor ? 'rgba(200,50,50,0.12)' : 'rgba(255,255,255,0.75)';
    this.ctx.strokeStyle = urgentColor ? 'rgba(200,50,50,0.4)' : 'rgba(42,90,140,0.15)';
    this.ctx.lineWidth = 1;
    this.ctx.beginPath();
    this.ctx.roundRect(px, py, pw, ph, 10);
    this.ctx.fill();
    this.ctx.stroke();

    // Text
    this.ctx.fillStyle = urgentColor ? '#c03030' : '#1a3a5c';
    this.ctx.fillText(text, this.width / 2, py + ph / 2);
    this.ctx.restore();
  }

  // --- Draw ---
  draw() {
    this.ctx.fillStyle = '#e8ecf2';
    this.ctx.fillRect(0, 0, this.width, this.height);
    if (!this.gameStarted) return;

    const bounds = this.getScreenBounds(1.5);

    // Draw zones (background)
    this.ctx.save();
    this.ctx.translate(this.width / 2, this.height / 2);
    this.ctx.scale(this.camera.zoom, this.camera.zoom);
    this.ctx.translate(-this.camera.x, -this.camera.y);

    this.zones.forEach(zone => {
      if (!this.isInScreen(zone, bounds)) return;
      this.ctx.fillStyle = zone.color;
      this.ctx.beginPath();
      this.ctx.arc(zone.x, zone.y, zone.radius, 0, Math.PI * 2);
      this.ctx.fill();
      // Vent glow
      if (zone.type === 'vent') {
        const grd = this.ctx.createRadialGradient(zone.x, zone.y, 0, zone.x, zone.y, zone.radius);
        grd.addColorStop(0, 'rgba(220,80,40,0.08)');
        grd.addColorStop(1, 'rgba(220,80,40,0)');
        this.ctx.fillStyle = grd;
        this.ctx.beginPath();
        this.ctx.arc(zone.x, zone.y, zone.radius, 0, Math.PI * 2);
        this.ctx.fill();
      }
      // Current arrow
      if (zone.type === 'current') {
        this.ctx.strokeStyle = 'rgba(30,120,220,0.18)';
        this.ctx.lineWidth = 3;
        const ax = zone.x + Math.cos(zone.angle) * zone.radius * 0.6;
        const ay = zone.y + Math.sin(zone.angle) * zone.radius * 0.6;
        this.ctx.beginPath();
        this.ctx.moveTo(zone.x - Math.cos(zone.angle) * zone.radius * 0.3,
                       zone.y - Math.sin(zone.angle) * zone.radius * 0.3);
        this.ctx.lineTo(ax, ay);
        this.ctx.stroke();
      }
    });

    this.ctx.restore();

    // Shrinking circle overlay
    this.drawCircle();

    // Particles
    this.drawParticles(bounds);

    // Creatures
    this.ctx.save();
    this.ctx.translate(this.width / 2, this.height / 2);
    this.ctx.scale(this.camera.zoom, this.camera.zoom);
    this.ctx.translate(-this.camera.x, -this.camera.y);

    this.creatures.forEach(c => {
      if (c.isUpgrading || !this.isInScreen(c, bounds)) return;
      if (c.scale) {
        this.ctx.save();
        this.ctx.translate(c.x, c.y);
        this.ctx.scale(c.scale, c.scale);
        this.ctx.translate(-c.x, -c.y);
        c.draw(this.ctx);
        this.ctx.restore();
      } else {
        c.draw(this.ctx);
      }
    });

    this.aiCreatures.forEach(c => {
      if (!this.isInScreen(c, bounds)) return;
      if (c.scale) {
        this.ctx.save();
        this.ctx.translate(c.x, c.y);
        this.ctx.scale(c.scale, c.scale);
        this.ctx.translate(-c.x, -c.y);
        c.draw(this.ctx);
        this.ctx.restore();
      } else {
        c.draw(this.ctx);
      }
    });

    this.ctx.restore();

    // Danger indicator
    if (this.dangerTimer > 150) {
      const alpha = ((this.dangerTimer - 150) / 30) * 0.3;
      this.ctx.fillStyle = `rgba(200,30,30,${alpha})`;
      this.ctx.fillRect(0, 0, this.width, 3);
      this.ctx.fillRect(0, this.height - 3, this.width, 3);
      this.ctx.fillRect(0, 0, 3, this.height);
      this.ctx.fillRect(this.width - 3, 0, 3, this.height);
    }

    // Minimap
    // Circle status UI
    this.drawCircleUI();

    if (this.frameCount % 5 === 0) this.drawMinimap();
  }

  drawParticles(bounds) {
    this.ctx.save();
    this.ctx.translate(this.width / 2, this.height / 2);
    this.ctx.scale(this.camera.zoom, this.camera.zoom);
    this.ctx.translate(-this.camera.x, -this.camera.y);

    // Draw visible particles
    const step = this.camera.zoom < 0.3 ? 4 : this.camera.zoom < 0.5 ? 2 : 1;
    for (let i = 0; i < this.particles.length; i += step) {
      const p = this.particles[i];
      if (!p) continue;
      if (p.x < bounds.minX || p.x > bounds.maxX || p.y < bounds.minY || p.y > bounds.maxY) continue;

      this.ctx.fillStyle = `rgba(42,90,140,${0.25 + p.size * 0.12})`;
      this.ctx.beginPath();
      this.ctx.arc(p.x, p.y, p.size * 0.5, 0, Math.PI * 2);
      this.ctx.fill();
    }
    this.ctx.restore();
  }

  // --- Main Loop ---
  animate() {
    if (this.gameStarted) {
      this.update();
      this.draw();
    } else if (this.previewMode) {
      this.updatePreview();
      this.drawPreview();
    }
    requestAnimationFrame(() => this.animate());
  }

  updatePreview() {
    this.frameCount++;
    // Slowly drift camera
    this.camera.x = Math.sin(this.frameCount * 0.001) * 200;
    this.camera.y = Math.cos(this.frameCount * 0.0007) * 150;
    // Update showcase creature
    this._updateShowcase();
    // Update AI creatures (simplified - just movement, no hunting)
    this.particleHash.clear();
    this.particles.forEach(p => this.particleHash.insert(p));
    this.aiCreatures.forEach(c => {
      if (c.isDying) return;
      // Simple wander
      c.wanderTimer++;
      if (c.wanderTimer > 120) { c.wanderAngle += (Math.random() - 0.5) * 0.8; c.wanderTimer = 0; }
      const sc = c.scale || 1;
      const wx = c.x + Math.cos(c.wanderAngle) * 200 * sc;
      const wy = c.y + Math.sin(c.wanderAngle) * 200 * sc;
      c.update(wx, wy, false, this.worldSize, []);
    });
    // Drift particles gently
    if (this.frameCount % 3 === 0) {
      this.particles.forEach(p => { p.x += p.vx; p.y += p.vy; p.vx *= 0.99; p.vy *= 0.99; });
    }
  }

  drawPreview() {
    this.ctx.fillStyle = '#e8ecf2';
    this.ctx.fillRect(0, 0, this.width, this.height);
    const bounds = this.getScreenBounds(1.5);

    // Draw zones
    this.ctx.save();
    this.ctx.translate(this.width / 2, this.height / 2);
    this.ctx.scale(this.camera.zoom, this.camera.zoom);
    this.ctx.translate(-this.camera.x, -this.camera.y);
    this.zones.forEach(zone => {
      if (!this.isInScreen(zone, bounds)) return;
      this.ctx.fillStyle = zone.color;
      this.ctx.beginPath();
      this.ctx.arc(zone.x, zone.y, zone.radius, 0, Math.PI * 2);
      this.ctx.fill();
    });
    this.ctx.restore();

    // Particles
    this.drawParticles(bounds);

    // AI creatures
    this.ctx.save();
    this.ctx.translate(this.width / 2, this.height / 2);
    this.ctx.scale(this.camera.zoom, this.camera.zoom);
    this.ctx.translate(-this.camera.x, -this.camera.y);
    this.aiCreatures.forEach(c => {
      if (c.isDying || !this.isInScreen(c, bounds)) return;
      if (c.scale) {
        this.ctx.save();
        this.ctx.translate(c.x, c.y);
        this.ctx.scale(c.scale, c.scale);
        this.ctx.translate(-c.x, -c.y);
        c.draw(this.ctx);
        this.ctx.restore();
      } else {
        c.draw(this.ctx);
      }
    });
    // Showcase creature (draw last, on top)
    this._drawShowcase(bounds);
    this.ctx.restore();
  }
}

  joystickZone.addEventListener('touchmove', e => {
    for (let i = 0; i < e.changedTouches.length; i++) {
      const t = e.changedTouches[i];
      if (t.identifier !== jState.touchId) continue;
      let dx = t.clientX - jState.baseX;
      let dy = t.clientY - jState.baseY;
      const dist = Math.sqrt(dx * dx + dy * dy);
      if (dist > jState.maxRadius) {
        dx = (dx / dist) * jState.maxRadius;
        dy = (dy / dist) * jState.maxRadius;
      }
      jState.dx = dx;
      jState.dy = dy;
      jThumb.style.left = (jState.baseX + dx) + 'px';
      jThumb.style.top = (jState.baseY + dy) + 'px';
    }
    e.preventDefault();
  }, { passive: false });

  const endJoystick = e => {
    for (let i = 0; i < e.changedTouches.length; i++) {
      if (e.changedTouches[i].identifier === jState.touchId) {
        jState.active = false;
        jState.touchId = null;
        jState.dx = 0;
        jState.dy = 0;
        jBase.style.display = 'none';
        jThumb.style.display = 'none';
      }
    }
  };
  joystickZone.addEventListener('touchend', endJoystick, { passive: false });
  joystickZone.addEventListener('touchcancel', endJoystick, { passive: false });

  // ============================
  // Action Buttons
  // ============================
  const btnDash = document.getElementById('btnDash');
  const btnSkill = document.getElementById('btnSkill');

  btnDash.addEventListener('touchstart', e => {
    e.preventDefault();
    e.stopPropagation();
    btnDash.classList.add('pressed');
    if (window._gameEngine) window._gameEngine.playerDash();
  }, { passive: false });
  btnDash.addEventListener('touchend', () => btnDash.classList.remove('pressed'));

  btnSkill.addEventListener('touchstart', e => {
    e.preventDefault();
    e.stopPropagation();
    btnSkill.classList.add('pressed');
    if (window._gameEngine) window._gameEngine.playerSkill();
  }, { passive: false });
  btnSkill.addEventListener('touchend', () => btnSkill.classList.remove('pressed'));

  // ============================
  // Visibility + Cooldown + Status sync
  // ============================
  function mobileUILoop() {
    const engine = window._gameEngine;

    // Show/hide actions + status
    const mobileActions = document.getElementById('mobileActions');
    const mobileStatus = document.getElementById('mobileStatus');
    if (engine && engine.gameStarted && !engine.gameOver && !engine.winState) {
      mobileActions.classList.add('visible');
      mobileStatus.classList.add('visible');
    } else {
      mobileActions.classList.remove('visible');
      mobileStatus.classList.remove('visible');
    }

    // Adjust HUD width to not overlap minimap
    adjustHUD();

    // Cooldown display
    if (engine && engine.creatures && engine.creatures.length > 0) {
      const leader = engine.creatures[0];

      if (leader.dashCooldown > 0) {
        btnDash.classList.add('on-cooldown');
        document.getElementById('btnDashCd').textContent = Math.ceil(leader.dashCooldown / 60) + 's';
      } else {
        btnDash.classList.remove('on-cooldown');
      }

      if (leader.skillCooldown > 0) {
        btnSkill.classList.add('on-cooldown');
        document.getElementById('btnSkillCd').textContent = Math.ceil(leader.skillCooldown / 60) + 's';
      } else {
        btnSkill.classList.remove('on-cooldown');
      }

      // Status: safe/danger indicator
      const dot = document.getElementById('statusDot');
      const text = document.getElementById('statusText');
      // Check if any predator is nearby
      let inDanger = false;
      if (engine.aiCreatures) {
        const px = leader.x, py = leader.y;
        const dangerRange = 400 * (leader.scale || 1);
        for (let i = 0; i < engine.aiCreatures.length; i++) {
          const ai = engine.aiCreatures[i];
          if (ai.type > engine.playerLevel) {
            const dx = ai.x - px, dy = ai.y - py;
            if (dx * dx + dy * dy < dangerRange * dangerRange) {
              inDanger = true;
              break;
            }
          }
        }
      }
      if (inDanger) {
        dot.classList.add('red');
        text.textContent = '⚠ 危险';
        text.style.color = '#c44';
      } else {
        dot.classList.remove('red');
        text.textContent = '安全';
        text.style.color = '';
      }
    }

    requestAnimationFrame(mobileUILoop);
  }
  requestAnimationFrame(mobileUILoop);

  // ============================
  // Audio unlock
  // ============================
  function unlockAudio() {
    if (window.AudioMgr && window.AudioMgr.ctx) {
      window.AudioMgr.ctx.resume().catch(() => {});
      try {
        const ctx = window.AudioMgr.ctx;
        const buf = ctx.createBuffer(1, 1, 22050);
        const src = ctx.createBufferSource();
        src.buffer = buf;
        src.connect(ctx.destination);
        src.start(0);
      } catch(e) {}
    }
    document.removeEventListener('touchstart', unlockAudio);
  }
  document.addEventListener('touchstart', unlockAudio, { once: true });

  if (isWeChat) {
    document.addEventListener('WeixinJSBridgeReady', () => {
      document.addEventListener('touchstart', unlockAudio, { once: true });
    });
  }

  console.log('[MobileAdapter] Ready: mobile=' + isMobile + ' WeChat=' + isWeChat + ' iOS=' + isIOS);
})();

</script>
</body>
